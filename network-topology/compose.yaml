services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    networks:
      - public_subnet
      - private_subnet
    restart: unless-stopped

  backend1:
    build: ./backend
    hostname: backend1
    environment:
      SERVER_ID: backend1
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - private_subnet
    restart: unless-stopped

  backend2:
    build: ./backend
    hostname: backend2
    environment:
      SERVER_ID: backend2
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - private_subnet
    restart: unless-stopped

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
